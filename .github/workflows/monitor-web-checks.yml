name: Hosted monitor checks
on:
  push:
    branches: [main]
    paths:
      - 'deploy/render/**'
      - 'render.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/serve_monitor_cloud.py'
      - 'scripts/serve_orderbook_monitor.py'
      - 'web/monitor/**'
      - 'scripts/check_monitor_cloud.py'
      - 'src/monitoring/web_*.py'
      - 'src/monitoring/breakout*.py'
      - 'tests/test_breakout_research.py'
      - 'tests/js/breakout.test.cjs'
      - 'tests/test_online_monitor.py'
      - 'tests/test_public_monitor.py'
      - 'tests/test_cloud_recovery_budget.py'
      - 'tests/js/monitor-http.test.cjs'
      - 'tests/js/capture-model.test.cjs'
      - 'tests/js/event-replay.test.cjs'
      - '.github/workflows/monitor-web-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r deploy/render/requirements.txt pytest PyYAML jsonschema
      - name: Validate Render Blueprint against official schema
        run: |
          python - <<'PY'
          import json, urllib.request, yaml
          from jsonschema import Draft202012Validator
          with urllib.request.urlopen('https://render.com/schema/render.yaml.json', timeout=20) as response:
              schema=json.load(response)
          with open('render.yaml') as source:
              blueprint=yaml.safe_load(source)
          Draft202012Validator(schema).validate(blueprint)
          assert all(x['plan']=='free' for group in ('services','databases') for x in blueprint[group])
          PY
      - run: python -m pytest tests/test_online_monitor.py tests/test_public_monitor.py tests/test_cloud_recovery_budget.py tests/test_breakout_research.py -q --basetemp=.pytest_online --tb=short
      - name: Verify unified viewer, capture clocks and replay cutoff
        run: node --test tests/js/event-replay.test.cjs tests/js/capture-model.test.cjs tests/js/ssi-live.test.cjs tests/js/monitor-http.test.cjs tests/js/breakout.test.cjs
      - name: Build Linux production image
        run: docker build -f Dockerfile -t liquiditylab-monitor:check .
      - name: Verify image health and access controls without SSI keys
        env:
          MONITOR_WEB_PASSWORD: fixture-web-password-32-characters
          MONITOR_CHECK_ORIGIN: http://127.0.0.1:10000
        run: |
          docker run --detach --name monitor-check --publish 127.0.0.1:10000:10000 --env MONITOR_PUBLIC_ORIGIN=http://127.0.0.1:10000 --env MONITOR_WEB_PASSWORD --env MONITOR_INGEST_TOKEN=fixture-ingest-token-32-characters liquiditylab-monitor:check
          python -m scripts.check_monitor_cloud
      - name: Verify public viewing with owner controls protected
        env:
          MONITOR_WEB_PASSWORD: fixture-web-password-32-characters
          MONITOR_CHECK_ORIGIN: http://127.0.0.1:10001
          MONITOR_PUBLIC_READ: 'true'
        run: |
          docker run --detach --name monitor-public-check --publish 127.0.0.1:10001:10000 --env MONITOR_PUBLIC_ORIGIN=http://127.0.0.1:10001 --env MONITOR_PUBLIC_READ --env MONITOR_WEB_PASSWORD --env MONITOR_INGEST_TOKEN=fixture-ingest-token-32-characters liquiditylab-monitor:check
          python -m scripts.check_monitor_cloud
      - name: Stop owned smoke container
        if: always()
        run: docker rm --force monitor-check monitor-public-check || true
