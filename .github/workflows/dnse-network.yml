name: DNSE REST and WebSocket network comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquiditylab-dnse-public-network
  cancel-in-progress: false

jobs:
  network:
    if: github.repository == 'TranThanhPhu39/neo-liquiditylab' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Compare official endpoints without credentials on the same runner
        shell: python
        run: |
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          import scripts.probe_dnse_network as probe
          reports = []
          for host in ('openapi.dnse.com.vn', 'ws-openapi.dnse.com.vn'):
              probe.HOST = host
              report = probe.diagnose()
              reports.append(report)
              print(json.dumps(report), flush=True)
          path = Path('report/dnse_network_comparison.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(reports, indent=2), encoding='utf-8')
      - name: Summarize and require verified TLS
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          path = Path('report/dnse_network_comparison.json')
          if not path.exists():
              raise SystemExit('PUBLIC_NETWORK_REPORT_MISSING')
          reports = json.loads(path.read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('```json\n' + json.dumps(reports, indent=2) + '\n```\n')
          raise SystemExit(0 if len(reports) == 2 and all(r['status'] == 'TCP_TLS_VERIFIED' for r in reports) else 1)
