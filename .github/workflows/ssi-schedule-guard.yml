name: SSI missed-start guard
on:
  schedule:
    - cron: '7,17,27,47,57 1-8 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: ssi-missed-start-guard
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'TranThanhPhu39/neo-liquiditylab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ssi.txt
      - name: Check and recover a missing session start
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.ssi_schedule_guard
