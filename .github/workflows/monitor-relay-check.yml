name: Hosted monitor relay check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-archived-relay-check
  cancel-in-progress: false

jobs:
  relay:
    if: github.repository == 'TranThanhPhu39/neo-liquiditylab' && github.ref == 'refs/heads/main' && vars.SSI_MONITOR_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install transport dependencies
        run: python -m pip install -r requirements-ssi.txt
      - name: Verify historical capture delivery without broker credentials
        env:
          SSI_MONITOR_URL: ${{ vars.SSI_MONITOR_URL }}
          SSI_MONITOR_INGEST_TOKEN: ${{ secrets.SSI_MONITOR_INGEST_TOKEN }}
          LIQUIDITYLAB_STATE_KEY: ${{ secrets.LIQUIDITYLAB_STATE_KEY }}
          PYTHONUTF8: '1'
        run: python -m scripts.check_monitor_relay
