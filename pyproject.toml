[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-liquidity-lab"
version = "0.1.0"
description = "Vietnamese pre-trade liquidity and hypothetical portfolio stress simulator"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.50,<2", "pandas>=2.2,<3", "numpy>=1.26,<3", "plotly>=5.24,<7", "python-dotenv>=1,<2", "PyYAML>=6,<7", "tzdata>=2024.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
parquet = ["pyarrow>=17"]

[tool.setuptools.packages.find]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

